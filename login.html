<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ResumeBuilder AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <i class="fas fa-file-alt"></i>
                <span>ResumeBuilder AI</span>
            </div>
            <h2>Welcome Back</h2>
            <p>Sign in to continue building your resume</p>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn-primary full-width">Sign In</button>
            </form>
            
            <div class="auth-links">
                <a href="register.html">Don't have an account? Sign up</a>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
